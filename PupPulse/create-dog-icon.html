<!DOCTYPE html>
<html>
<head>
    <title>PupPulse Icon Generator</title>
    <style>
        body { margin: 0; padding: 20px; background: #f0f0f0; }
        canvas { border: 2px solid #333; margin: 10px; }
        .container { text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🐕 PupPulse App Icon Generator</h2>
        <canvas id="iconCanvas" width="1024" height="1024"></canvas>
        <br>
        <button onclick="generateIcon()">Generate Icon</button>
        <button onclick="downloadIcon()">Download Icon</button>
    </div>

    <script>
        function generateIcon() {
            const canvas = document.getElementById('iconCanvas');
            const ctx = canvas.getContext('2d');
            
            // Clear canvas
            ctx.clearRect(0, 0, 1024, 1024);
            
            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, 1024, 1024);
            gradient.addColorStop(0, '#4CAF50');
            gradient.addColorStop(1, '#2E7D32');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 1024, 1024);
            
            // White circle background
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.arc(512, 512, 400, 0, 2 * Math.PI);
            ctx.fill();
            
            // Dog head outline
            ctx.strokeStyle = '#4CAF50';
            ctx.lineWidth = 20;
            ctx.beginPath();
            ctx.arc(512, 400, 180, 0, 2 * Math.PI);
            ctx.stroke();
            
            // Dog ears
            ctx.fillStyle = '#4CAF50';
            ctx.beginPath();
            ctx.ellipse(400, 280, 60, 80, -0.5, 0, 2 * Math.PI);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(624, 280, 60, 80, 0.5, 0, 2 * Math.PI);
            ctx.fill();
            
            // Inner ear color
            ctx.fillStyle = '#FFB6C1';
            ctx.beginPath();
            ctx.ellipse(400, 280, 35, 50, -0.5, 0, 2 * Math.PI);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(624, 280, 35, 50, 0.5, 0, 2 * Math.PI);
            ctx.fill();
            
            // Eyes
            ctx.fillStyle = '#333333';
            ctx.beginPath();
            ctx.arc(470, 380, 25, 0, 2 * Math.PI);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(554, 380, 25, 0, 2 * Math.PI);
            ctx.fill();
            
            // Eye highlights
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.arc(475, 375, 8, 0, 2 * Math.PI);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(559, 375, 8, 0, 2 * Math.PI);
            ctx.fill();
            
            // Nose
            ctx.fillStyle = '#333333';
            ctx.beginPath();
            ctx.ellipse(512, 450, 20, 15, 0, 0, 2 * Math.PI);
            ctx.fill();
            
            // Mouth
            ctx.strokeStyle = '#333333';
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.arc(512, 480, 60, 0, Math.PI);
            ctx.stroke();
            
            // Tongue
            ctx.fillStyle = '#FF6B6B';
            ctx.beginPath();
            ctx.ellipse(512, 500, 15, 25, 0, 0, 2 * Math.PI);
            ctx.fill();
            
            // Heart symbol for health
            ctx.fillStyle = '#FF6B6B';
            ctx.beginPath();
            ctx.moveTo(512, 600);
            ctx.bezierCurveTo(512, 580, 480, 580, 480, 600);
            ctx.bezierCurveTo(480, 620, 512, 650, 512, 650);
            ctx.bezierCurveTo(512, 650, 544, 620, 544, 600);
            ctx.bezierCurveTo(544, 580, 512, 580, 512, 600);
            ctx.fill();
            
            // Plus sign for health monitoring
            ctx.strokeStyle = '#4CAF50';
            ctx.lineWidth = 15;
            ctx.beginPath();
            ctx.moveTo(512, 720);
            ctx.lineTo(512, 780);
            ctx.moveTo(470, 750);
            ctx.lineTo(554, 750);
            ctx.stroke();
            
            // App name
            ctx.fillStyle = '#4CAF50';
            ctx.font = 'bold 48px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('PupPulse', 512, 850);
            
            // Subtitle
            ctx.fillStyle = '#666666';
            ctx.font = 'bold 24px Arial';
            ctx.fillText('AI Dog Health', 512, 890);
        }
        
        function downloadIcon() {
            const canvas = document.getElementById('iconCanvas');
            const link = document.createElement('a');
            link.download = 'puppulse-icon.png';
            link.href = canvas.toDataURL();
            link.click();
        }
        
        // Generate icon on load
        window.onload = generateIcon;
    </script>
</body>
</html>
